<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tail Tales</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🐾 Tail Tales 🐾</h1>
  <p>Turn your dog into the star of their own story</p>
  <form id="storyForm">
    <label for="dogName">Dog's Name:</label>
    
    <input type="text" id="dogName" name="dogName" placeholder="e.g. Bruno">
    <label for="breed">Breed:</label>
    <input type="text" id="breed" name="breed" placeholder="e.g. Labrador">
    <label for="habit">A Quirky Habit:</label>
    <input type="text" id="habit" name="habit" placeholder="e.g. howls at the doorbell"> 
    <label for="genre">Genre:</label>
    <select id="genre" name="genre">
     <option value="mystery">Mystery</option>
     <option value="comedy">Comedy</option>
     <option value="heartwarming">Heartwarming</option>
     <option value="thriller">Thriller</option>
    </select>
    <button type="button" id="generateBtn">Generate Story</button>
  </form>
    <div id="storyOutput"></div>
    <script src="script.js"></script>
</body>
</body>
</html>
